name: Build sidecar

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            extension: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            extension: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            extension: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "siriusxm-sidecar-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}" ./server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: siriusxm-sidecar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: siriusxm-sidecar-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          if-no-files-found: error

  macos-installer:
    name: Package macOS disk image
    needs: build
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download macOS builds
        uses: actions/download-artifact@v7
        with:
          pattern: siriusxm-sidecar-darwin-*
          path: macos-builds
          merge-multiple: true

      - name: Create unsigned disk image
        run: |
          mkdir -p dmg-root dist
          cp macos-builds/siriusxm-sidecar-darwin-amd64 dmg-root/
          cp macos-builds/siriusxm-sidecar-darwin-arm64 dmg-root/
          cp "packaging/macos/Run Sidecar.command" dmg-root/
          cp packaging/macos/README.txt dmg-root/
          chmod +x dmg-root/Run\ Sidecar.command dmg-root/siriusxm-sidecar-darwin-*
          hdiutil create -volname SiriusXM-Sidecar -srcfolder dmg-root \
            -ov -format UDZO dist/SiriusXM-Sidecar-macos.dmg

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: siriusxm-sidecar-macos-installer
          path: dist/SiriusXM-Sidecar-macos.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, macos-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download build and installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: siriusxm-sidecar-*
          path: dist
          merge-multiple: true

      - name: Publish release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: "The current sxm.py script is embedded in the executable. macOS users can download SiriusXM-Sidecar-macos.dmg. Python 3.14 with the requests package and FFmpeg are required."
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$TAG_NAME" --generate-notes \
              --notes "$RELEASE_NOTES" --verify-tag
          fi

          for asset in dist/*; do
            gh release upload "$TAG_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done

          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" --verify-tag --draft=false
