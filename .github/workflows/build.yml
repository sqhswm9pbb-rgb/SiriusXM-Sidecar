name: Build sidecar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            extension: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "siriusxm-sidecar-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}" ./server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: siriusxm-sidecar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: siriusxm-sidecar-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          if-no-files-found: error
